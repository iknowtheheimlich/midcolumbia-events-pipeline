[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "midcolumbia-events-pipeline"
version = "0.1.0"
description = "Mid-Columbia/Tri-Cities event ingestion pipeline for Reddit, Notion, and Mission Control workflows."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "playwright",
]

[project.scripts]
cargo-harvester = "cargo_harvester.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
